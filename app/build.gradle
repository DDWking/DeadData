plugins {
    id "com.android.application"
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}

def releaseSigningFile = rootProject.file("release-signing.properties")
def releaseSigning = null
if (releaseSigningFile.exists()) {
    releaseSigning = new Properties()
    releaseSigningFile.withInputStream { releaseSigning.load(it) }
}

android {
    namespace "app.deaddata.mobile"
    compileSdk 36

    defaultConfig {
        applicationId "app.deaddata.mobile"
        minSdk 26
        targetSdk 36
        versionCode 9
        versionName "1.4.0"
    }

    if (releaseSigning != null) {
        signingConfigs {
            release {
                storeFile rootProject.file(releaseSigning.getProperty("storeFile"))
                storePassword releaseSigning.getProperty("storePassword")
                keyAlias releaseSigning.getProperty("keyAlias")
                keyPassword releaseSigning.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseSigning != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
